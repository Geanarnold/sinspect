# Publica o Configurador Drive-In (drive-in/app) no Azure Static Web Apps.
# Só roda depois que a TI criar o recurso no Azure e cadastrar o segredo AZURE_STATIC_WEB_APPS_API_TOKEN
# no repositório (Settings > Secrets and variables > Actions). Sem o segredo, o job é pulado.
name: Drive-In - publicar no Azure

on:
  push:
    branches: [main]
    paths: ['drive-in/app/**']
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Verifica se o Azure já foi configurado
        id: cfg
        run: echo "ok=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - name: Publicar
        if: steps.cfg.outputs.ok == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: drive-in/app
          skip_app_build: true
